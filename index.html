<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Android TV M3U Player - Compacto</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  display: flex;
  width: 100vw;
  height: 100vh;
}

/* PLAYER */
#player-container {
  width: 60%;
  height: 100%;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  align-items: center;
  justify-content: center;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

/* LISTA */
#playlist {
  width: 40%;
  display: grid;
  grid-template-columns: 1fr;
  grid-auto-rows: 90px;   /* 👈 más compacto */
  gap: 10px;
  padding: 10px;
  overflow-y: auto;
  background: #000;
}

/* ITEM */
.item {
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 10px;
  background: #111;
  outline: none;
  padding: 6px;
  transition: transform .15s ease, box-shadow .15s ease;
  height: 80px;  /* 👈 más pequeño */
}

.item:focus {
  transform: scale(1.04);
  box-shadow: 0 0 0 3px #1e90ff;
  z-index: 2;
}

.item.active {
  box-shadow: 0 0 0 3px #00bfff;
}

/* IMAGEN MÁS PEQUEÑA */
.item img {
  width: 70px;        /* 👈 tamaño reducido */
  height: 60px;
  object-fit: contain;
  background: #000;
  border-radius: 6px;
  padding: 4px;
}

/* TEXTO */
.item span {
  flex: 1;
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
</style>
</head>

<body>

<div id="app">
  <div id="player-container">
    <iframe id="player" allow="autoplay; fullscreen"></iframe>
  </div>
  <div id="playlist"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const m3uUrl = "https://raw.githubusercontent.com/supervectar-coder/v-los-visitantes/refs/heads/main/V%20los%20visitantes%20retro.m3u";

let videos = [];
let current = parseInt(localStorage.getItem("lastIndex")) || 0;

let ytPlayer = null;
let ytReady = false;

function onYouTubeIframeAPIReady() {
  ytReady = true;
}

fetch(m3uUrl)
  .then(r => r.text())
  .then(parseM3U);

function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  let title = "", logo = "";

  lines.forEach(line => {
    line = line.trim();
    if (!line) return;

    if (line.startsWith("#EXTINF")) {
      title = line.split(",").pop();
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      logo = logoMatch ? logoMatch[1] : "";
    } 
    else if (!line.startsWith("#")) {
      let url = line;

      const okMatch = url.match(/ok\.ru\/video\/([^?]+)/);
      if (okMatch) {
        url = "https://ok.ru/videoembed/" + okMatch[1];
      }

      if (url.includes("youtube")) {
        const id = url.includes("youtu.be/")
          ? url.split("youtu.be/")[1]
          : url.split("v=")[1].split("&")[0];
        url = "youtube:" + id;
      }

      videos.push({ title, url, logo });
      title = "";
      logo = "";
    }
  });

  render();
  focusItem(current, true);
}

function render() {
  const list = document.getElementById("playlist");
  list.innerHTML = "";

  videos.forEach((v, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.tabIndex = 0;
    div.onclick = () => play(i);

    if (v.logo) {
      const img = document.createElement("img");
      img.src = v.logo;
      img.onerror = () => img.style.display = "none";
      div.appendChild(img);
    }

    const span = document.createElement("span");
    span.textContent = v.title || `Episodio ${i + 1}`;
    div.appendChild(span);

    list.appendChild(div);
  });
}

function play(i) {
  current = i;
  localStorage.setItem("lastIndex", i);

  const video = videos[i];
  const playerContainer = document.getElementById("player-container");

  playerContainer.innerHTML = "";

  if (video.url.startsWith("youtube:")) {
    const id = video.url.split(":")[1];

    const wait = () => {
      if (!ytReady) return setTimeout(wait, 50);

      const div = document.createElement("div");
      div.id = "player";
      playerContainer.appendChild(div);

      ytPlayer = new YT.Player("player", {
        videoId: id,
        playerVars: { autoplay: 1, modestbranding: 1 },
        events: {
          onReady: e => e.target.setPlaybackQuality('hd1080')
        }
      });
    };

    wait();
  } else {
    const iframe = document.createElement("iframe");
    iframe.id = "player";
    iframe.allow = "autoplay; fullscreen";
    iframe.src = video.url + "?autoplay=1";
    playerContainer.appendChild(iframe);
  }

  document.querySelectorAll(".item").forEach((el, idx) =>
    el.classList.toggle("active", idx === i)
  );

  focusItem(i);
}

function focusItem(i, instant=false) {
  const item = document.querySelectorAll(".item")[i];
  if (!item) return;

  item.focus();
  item.scrollIntoView({ behavior: instant ? "auto" : "smooth", block: "nearest" });
}

document.addEventListener("keydown", e => {
  const max = videos.length - 1;

  if (e.key === "ArrowRight" && current < max) current++;
  if (e.key === "ArrowLeft" && current > 0) current--;
  if (e.key === "ArrowDown" && current + 1 <= max) current++;
  if (e.key === "ArrowUp" && current - 1 >= 0) current--;

  if (["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(e.key)) {
    e.preventDefault();
    focusItem(current);
  }

  if (e.key === "Enter") play(current);

  if (e.key === "Backspace" || e.key === "Escape") {
    document.getElementById("player-container").innerHTML =
      '<iframe id="player" allow="autoplay; fullscreen"></iframe>';
    focusItem(current);
  }
});
</script>

</body>
</html>
